# Gates for `mw orchestrate` runs on this repo (TypeScript Bun workspaces monorepo).
gate_timeout = 900
gates = [
  ["bun", "run", "typecheck"],
  ["bun", "run", "test"],
  # real Chromium against the Vite dev server; needs `bunx playwright install chromium` once
  ["bun", "run", "--filter", "@pickynotes/desktop", "e2e"],
]

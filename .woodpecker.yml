# Ersetzt GitHub Actions (Account-weite Budget-Sperre): nur Lint + Typecheck, nur beim PR.
when:
  - event: pull_request
    branch: main

steps:
  - name: install
    image: node:22-bookworm
    commands:
      - npm install -g bun@1.4.4
      - bun install --frozen-lockfile

  - name: typecheck
    image: node:22-bookworm
    commands:
      - npm install -g bun@1.4.4
      - bun run typecheck

[package]
name = "pickynotes"
version = "0.1.0"
edition = "2021"

[lib]
name = "pickynotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
keyring = { version = "3", features = ["apple-native"] }
base64 = "0.22"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSPanel", "NSResponder", "NSView", "NSColor", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer"] } # layer corner radius; already in the tree via objc2-app-kit
